<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Memories Journal</title>
    <meta name="description" content="A private, beautiful timeline journal for couples to log their date memories together.">
    <meta name="theme-color" content="#FFD4A2">
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Our Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="timeline-page">
    <header class="timeline-header">
        <h1>💕 Dating Memories</h1>
        <button id="logoutBtn" class="btn-text">Log Out</button>
    </header>

    <!-- Phase 6+: Dashboard & Controls -->
    <div class="dashboard-header hidden" id="dashboardHeader">
        <!-- Stats -->
        <div class="stats-panel">
            <div class="stat-item">
                <span class="stat-value" id="statMemories">0</span>
                <span class="stat-label">Memories</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="statCities">0</span>
                <span class="stat-label">Locations</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="control-bar">
            <input type="text" id="searchFilter" placeholder="Search memories..." autocomplete="off">
            <select id="yearFilter">
                <option value="All">All Years</option>
            </select>
        </div>
    </div>

    <main class="timeline-container" id="timeline">
        <div class="empty-state" id="emptyState" class="hidden">
            <h2>No memories yet 💕</h2>
            <p>Tap the + button below to add your first date memory.</p>
        </div>
    </main>
    
    <!-- Floating 'Add Memory' Button -->
    <button id="fabAdd" class="fab glowing-pink">+</button>

    <!-- ADD MEMORY MODAL -->
    <div id="addMemoryModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>New Memory ✨</h2>
            <p class="subtitle">Capture the moment</p>
            
            <form id="memoryForm">
                <!-- PHOTO UPLOAD -->
                <div class="form-group">
                    <label>Date Photo</label>
                    <div class="photo-upload-area" id="photoDropZone">
                        <span class="upload-icon">📷</span>
                        <span>Click to upload a photo</span>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <img id="photoPreview" class="photo-preview hidden" alt="preview">
                </div>

                <!-- DATE -->
                <div class="form-group">
                    <label>Date of Memory</label>
                    <input type="date" id="memoryDate" required>
                </div>

                <!-- CAPTION -->
                <div class="form-group">
                    <label>Caption</label>
                    <textarea id="memoryCaption" placeholder="What made this moment special?" required></textarea>
                </div>

                <!-- LOCATION -->
                <div class="form-group" style="position: relative;">
                    <label>Location Name</label>
                    <input type="text" id="memoryLocation" placeholder="e.g. Millennium Park, Chicago" autocomplete="off" required>
                    <ul id="locationSuggestions" class="suggestions-dropdown hidden"></ul>
                </div>

                <!-- MOOD -->
                <div class="form-group">
                    <label>Mood</label>
                    <div class="mood-selector" id="moodSelector">
                        <div class="mood-pill" data-mood="😍">😍</div>
                        <div class="mood-pill" data-mood="🥰">🥰</div>
                        <div class="mood-pill" data-mood="😂">😂</div>
                        <div class="mood-pill" data-mood="🌹">🌹</div>
                        <div class="mood-pill" data-mood="✨">✨</div>
                        <div class="mood-pill" data-mood="🎉">🎉</div>
                        <div class="mood-pill" data-mood="☕">☕</div>
                        <div class="mood-pill" data-mood="🌅">🌅</div>
                    </div>
                </div>

                <div id="memoryStatusMsg" class="status-message hidden" style="margin-bottom: 20px;"></div>
                
                <!-- BUTTONS -->
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" id="cancelMemoryBtn">Cancel</button>
                    <button type="submit" class="btn-primary glowing-pink" id="saveMemoryBtn">Save Memory</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
